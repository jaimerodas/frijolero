AllCops:
  NewCops: enable

Style/Documentation:
  Enabled: false

# --- Test files ----------------------------------------------------------
# Tests are intentionally verbose: arrange/act/assert reads like a
# specification, and forcing extractions adds ceremony without value.
# Stubs use singleton-method idioms (TrivialAccessors); test names with
# HTTP status codes (test_..._on_401) are meaningful (VariableNumber).
Metrics/BlockLength:
  Exclude: ['test/**/*']

Style/TrivialAccessors:
  Exclude: ['test/**/*']

Naming/VariableNumber:
  Exclude: ['test/**/*']

# --- Production methods that earned their length -------------------------
# Each name below corresponds to a method that's measurably above the
# default but where further extraction would weaken cohesion.
#
# Multi-line output builders (the structure of the output is the method):
#   format_transaction      Converters::Default
#   transaction_summary     UI
#   handle_sell             Converters::Fintual
#
# Orchestrators with required rescue/branching at the call site:
#   run_pipeline            Statement
#   execute                 OpenAIClient::Transport
#   process_one             BeancountMerger
#   raise_error_for         OpenAIClient::Transport (case on HTTP status)
#   upload_file             OpenAIClient
#   extract_transactions    OpenAIClient
#   poll_response           OpenAIClient (loop with three case branches)
#   run                     entry-point methods (batch loops)
Metrics/MethodLength:
  Exclude: ['test/**/*']
  AllowedMethods:
    - format_transaction
    - transaction_summary
    - handle_sell
    - run_pipeline
    - execute
    - process_one
    - raise_error_for
    - upload_file
    - extract_transactions
    - run
    - poll_response

# AccountTargets is a named bag of destination accounts (counterpart, interest,
# tax, dividend, gains, fees, withholding). Keyword arguments are the point of
# the class; collapsing them into a hash would lose the named defaults.
#
# Statement#initialize takes the six things a job knows about one PDF (account,
# period, file id, overwrite, dry run); they are optional keywords with defaults,
# and an options hash would only hide them.
Metrics/ParameterLists:
  Exclude:
    - 'lib/converters/account_targets.rb'
    - 'lib/statement.rb'

# `b2` is what the class (Frijolero::B2) and the collaborator are called everywhere
# else, so it is the name the keyword argument has to have. The rest of the list is
# the cop's own default, which must be repeated because AllowedNames replaces it
# (`io` in particular is the converters' `run_to(io)`).
Naming/MethodParameterName:
  AllowedNames: [as, at, b2, by, cc, db, id, 'if', 'in', io, ip, of, 'on', os, pp, to]

# UI.confirm is the public name callers already use (a yes/no answer without
# a terminal to ask); renaming it to confirm? would ripple through every caller.
Naming/PredicateMethod:
  Exclude:
    - 'lib/ui.rb'

Metrics/AbcSize:
  Exclude: ['test/**/*']
  AllowedMethods:
    - format_transaction
    - transaction_summary
    - handle_sell
    - run_pipeline
    - execute

# --- Class-level exceptions ----------------------------------------------
# Statement orchestrates the full PDF lifecycle (parse, upload, extract,
# save, detail, convert, merge, finalize, error handling). Methods are
# small but there are enough of them that the class lands at ~158 lines —
# splitting would shred a cohesive workflow.
#
# Converters::Fintual handles 6 transaction types, each in its own small
# handler method, plus shared helpers. ~102 lines; splitting per-handler
# files would be more navigation than understanding.
#
# Converters::Plata is the largest class in the app: 41 methods over ~380 lines
# of file. Measured, not estimated. It is one job (convert an Alpaca statement)
# expressed as many small writers -- every method passes Metrics/MethodLength,
# AbcSize and CyclomaticComplexity on its own.
#
# The collaborators that could reasonably be pulled out already have been, and
# they are the ones that carry rules rather than formatting: Plata::Entry
# (flattening four detail tables into one ordered stream) and
# Plata::CorporateAction (allocating cost basis across a split or spinoff), plus
# Converters::Amounts for number handling. What is left is a handler per Alpaca
# entry type, a fallback writer for entry types we do not recognise, and the
# period-end writers (prices, balance assertions, the audit header).
#
# The remaining split candidate is the period-end group, which derives from the
# statement's closing tables rather than its movements. It is not extracted
# because a collaborator would need io, account, currency, holdings, the cash
# summary, the cash holding row, realized gain/loss and the period dates:
# eight pieces of borrowed state for sixty lines. Revisit if a fourth
# period-end concern appears.
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/statement.rb'
    - 'lib/converters/fintual.rb'
    - 'lib/converters/plata.rb'
    # Web::App: routes are a table; each handler is a few lines.
    - 'app/app.rb'
