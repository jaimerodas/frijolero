# The deployment of the author. To deploy your own copy, change: the host under
# servers.web.hosts, proxy.host, image, registry.username, and S3_ENDPOINT and
# S3_BUCKET under env.clear (any S3-compatible bucket; S3_REGION and S3_PATH_STYLE
# when the provider needs them, see docs/setup.md). The secrets come from .kamal/secrets.
service: frijolero
image: jaimerodas/frijolero

servers:
  web:
    hosts:
      - 146.190.35.4 # maia
    options:
      memory: 256m # 35-42 MiB after a boot, ~100 MiB after two weeks (Ruby keeps its heap), plus a ~21 MB rledger child per report

proxy:
  ssl: true
  host: frijolero.pati.to
  app_port: 9292
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: jaimerodas
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

volumes:
  - frijolero_data:/data

env:
  clear:
    DATA_DIR: /data
    APP_URL: https://frijolero.pati.to # the links in the sign-in emails, never from the request's Host
    MAIL_FROM: "Frijolero <frijolero@pati.to>"
    # Read once, at the first boot with the database: that ledger moves under /data/ledgers/.
    LEDGER_DIR: /data/ledger
    LEDGER_MAIN_FILE: moneys.beancount
    PUMA_THREADS: "3"
    S3_ENDPOINT: s3.us-west-000.backblazeb2.com
    S3_BUCKET: rodas-app-backups
  secret:
    - ADMIN_EMAIL # the first admin, made at the first boot with the database
    - OPENAI_API_KEY # for Anthropic: LLM_PROVIDER: anthropic under clear, ANTHROPIC_API_KEY here and in .kamal/secrets
    - SESSION_SECRET # signs the session cookie: 64 bytes or more (openssl rand -hex 64)
    - POSTMARK_API_TOKEN # the sign-in emails; without it, the links go to the log
    - S3_KEY_ID
    - S3_KEY
    - GIT_TOKEN

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse bash
