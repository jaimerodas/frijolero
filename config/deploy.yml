# The deployment of the author. To deploy your own copy, change: the host under
# servers.web.hosts, proxy.host, image, registry.username, and S3_ENDPOINT and
# S3_BUCKET under env.clear (any S3-compatible bucket; S3_REGION and S3_PATH_STYLE
# when the provider needs them, see docs/setup.md). The secrets come from .kamal/secrets.
service: frijolero
image: jaimerodas/frijolero

servers:
  web:
    hosts:
      - 146.190.35.4 # maia
    options:
      memory: 128m # ~45 MB RSS idle plus a ~21 MB rledger child per report; an overrun is a visible restart

proxy:
  ssl: true
  host: frijolero.pati.to
  app_port: 9292
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: jaimerodas
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

volumes:
  - frijolero_data:/data

env:
  clear:
    LEDGER_DIR: /data/ledger
    LEDGER_MAIN_FILE: moneys.beancount
    PUMA_THREADS: "3"
    S3_ENDPOINT: s3.us-west-000.backblazeb2.com
    S3_BUCKET: rodas-app-backups
  secret:
    - OPENAI_API_KEY
    - APP_PASSWORD
    - S3_KEY_ID
    - S3_KEY
    - GIT_TOKEN

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse bash
