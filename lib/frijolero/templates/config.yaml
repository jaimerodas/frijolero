# Frijolero Configuration
# Copy this file to ~/.frijolero/config.yaml and edit as needed

# OpenAI API key for PDF extraction
openai_api_key: your_key_here

# Seconds to keep polling a background extraction before giving up (default 900).
# OpenAI retains background results for ~10 minutes, so avoid going much higher.
# openai_poll_timeout: 900

# Extraction prompts live in ~/.frijolero/prompts/<type>/ — one folder per prompt type,
# each with spec.json (model + format), instructions.txt, and schema.json. accounts.yaml
# selects a folder via `openai_prompt_type`.

# File paths (use ~ for home directory)
paths:
  # Main beancount ledger file to merge transactions into
  beancount_main: ~/finances/main.beancount

  # Beancount file with account declarations (open directives) for autocomplete
  beancount_accounts: ~/finances/main.beancount

  # Directory where PDF statements are placed for processing
  statements_input: ~/Downloads/statements

  # Directory where processed files are saved
  statements_output: ~/finances/processed
